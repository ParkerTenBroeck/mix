[package]
name = "mix"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["cli"]
default-members = [".", "cli"]

[dependencies]
annotate-snippets = "*"
dumpster = "*"
rustc-hash = "*"
serde = { version = "*", features = ["derive", "rc"] }
serde_json = "1"
regex = "*"

[profile.release]
debug = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-Wl,--no-rosegment"]
